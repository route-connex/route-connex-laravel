name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl, mongodb
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel: [12.*, 13.*]
        # Minimum supported versions (MySQL 8.0, PostgreSQL 14, MongoDB 7.0) plus newer targets.
        db:
          - connection: mysql
            image: mysql:8.0
            port: 3306
            health: "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          - connection: mysql
            image: mysql:8.4
            port: 3306
            health: "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          - connection: pgsql
            image: postgres:14
            port: 5432
            health: "pg_isready -U testing -d testing"
          - connection: pgsql
            image: postgres:17
            port: 5432
            health: "pg_isready -U testing -d testing"
          - connection: pgsql
            image: postgres:18
            port: 5432
            health: "pg_isready -U testing -d testing"
          - connection: mongodb
            image: mongo:7.0
            port: 27017
            health: "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          # Not mongo:8 (= 8.3): MongoDB 8.0/8.3 builds refuse to start on Linux kernels
          # 6.19 to 7.0.13, which GitHub's runners currently use. 8.2 is reported to start:
          # https://jira.mongodb.org/browse/SERVER-121912, https://jira.mongodb.org/browse/SERVER-136272
          # Switch back to mongo:8 once the runner kernel is >= 7.0.14.
          - connection: mongodb
            image: mongo:8.2
            port: 27017
            health: "mongosh --quiet --eval 'db.runCommand({ping:1})'"
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: DB ${{ matrix.db.image }} - L${{ matrix.laravel }}

    services:
      # One service per job: the database under test, configured from the matrix.
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - ${{ matrix.db.port }}:${{ matrix.db.port }}
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.db.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db.port }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, intl, mongodb
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Test Suite
        run: vendor/bin/pest
