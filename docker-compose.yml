# Database versions default to the latest supported; override to test others, e.g.
# MYSQL_VERSION=8.0 make test-mysql, POSTGRES_VERSION=14 make test-pgsql, MONGO_VERSION=7.0 make test-mongodb
# Minimum supported: MySQL 8.0, PostgreSQL 14, MongoDB 7.0.
services:
  app:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: route-connex-laravel-php
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/home/app/.composer
    ports:
      - "8000:8000"

  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    profiles: [databases]
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgsql:
    image: postgres:${POSTGRES_VERSION:-18}
    profiles: [databases]
    environment:
      POSTGRES_DB: testing
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
      # Keep data inside the tmpfs for every version: 14-17 declare a volume at
      # /var/lib/postgresql/data (which would outlive version switches), and 18
      # refuses to start with a mount there.
      PGDATA: /var/lib/postgresql/pgdata
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testing", "-d", "testing"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:${MONGO_VERSION:-8}
    profiles: [databases]
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  composer-cache:
