services:
  app:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: route-connex-laravel-php
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/home/app/.composer
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}

  mysql:
    image: mysql:8.4
    profiles: [databases]
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgsql:
    image: postgres:17
    profiles: [databases]
    environment:
      POSTGRES_DB: testing
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "testing", "-d", "testing"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:8
    profiles: [databases]
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  composer-cache:
